<title>商品カルテ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f7f9fb; --ink:#17212f; --ink2:#45536a; --muted:#768397;
  --line:#dce2ea; --line2:#edf1f5; --grid:#e8ecf1;
  --accent:#1f497d; --accent2:#2e74b5; --accent-soft:#e7eef8;
  --good:#2e7d32; --good-bg:#e5f2e6; --warn:#a85a00; --warn-bg:#fcefd9; --crit:#c62828; --crit-bg:#fbe4e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#4a3aa7; --rsv:#9dc3f0;
  --shadow:0 1px 2px rgba(23,33,47,.05),0 8px 24px rgba(23,33,47,.07);
  --sans:"IBM Plex Sans","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151c; --panel:#17202a; --panel2:#1c2530; --ink:#e8edf4; --ink2:#b4c0ce; --muted:#8592a4;
    --line:#2a3542; --line2:#212b37; --grid:#243040;
    --accent:#9bbde8; --accent2:#5d9be0; --accent-soft:#1d2b3e;
    --good:#72c476; --good-bg:#1b3121; --warn:#f0a648; --warn-bg:#382911; --crit:#ef7474; --crit-bg:#3b1b1c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --rsv:#2b5590;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  :root:not([data-theme="light"]) .evg-S{--gc:#c9992e} :root:not([data-theme="light"]) .m-so{--mc:#3fb6c2} :root:not([data-theme="light"]) .m-sur{--mc:#b48ad8}
  :root:not([data-theme="light"]) .ev-badge,:root:not([data-theme="light"]) .chip.evg{color:#10151c}
}
:root[data-theme="dark"] .evg-S{--gc:#c9992e} :root[data-theme="dark"] .m-so{--mc:#3fb6c2} :root[data-theme="dark"] .m-sur{--mc:#b48ad8}
:root[data-theme="dark"] .ev-badge,:root[data-theme="dark"] .chip.evg{color:#10151c}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151c; --panel:#17202a; --panel2:#1c2530; --ink:#e8edf4; --ink2:#b4c0ce; --muted:#8592a4;
  --line:#2a3542; --line2:#212b37; --grid:#243040;
  --accent:#9bbde8; --accent2:#5d9be0; --accent-soft:#1d2b3e;
  --good:#72c476; --good-bg:#1b3121; --warn:#f0a648; --warn-bg:#382911; --crit:#ef7474; --crit-bg:#3b1b1c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --rsv:#2b5590;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;padding-inline:24px;padding-block:18px 48px}
.app{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* top */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px}
.mark b{font-family:"BIZ UDPGothic",var(--sans);font-size:15px;letter-spacing:.06em;color:var(--accent)}
.trial{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.asof{font-size:11.5px;color:var(--muted)}
/* picker */
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pk{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;min-width:150px;text-align:left}
.pk small{color:var(--muted);font-size:11px}
.pk span{font-size:12.5px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk[aria-pressed="true"]{border-color:var(--accent2);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent2)}
.pk:hover{border-color:var(--accent2)}
.navbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px}
/* product header */
.phead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.phead h1{font-family:"BIZ UDPGothic",var(--sans);font-size:19px;font-weight:700;margin:0;text-wrap:balance;max-width:760px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.chip.strong{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pricebox{display:flex;align-items:baseline;gap:10px}
.pricebox .big{font-size:24px;font-weight:600}
.pricebox .was{color:var(--muted);text-decoration:line-through}
.off{font-weight:600;color:var(--s2)}
.link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--accent);text-decoration:none;background:var(--panel)}
.link:hover{border-color:var(--accent2)}
/* tabbar */
.tabbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px}
.tab{background:none;border:none;padding:9px 16px 10px;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent2);font-weight:600}
.tab small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.controls{display:flex;gap:14px;align-items:center;padding-bottom:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.ctl-label{font-size:11.5px;color:var(--muted);margin-right:6px}
/* panels */
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.tw{overflow-x:auto;max-width:100%}
#dTable{overscroll-behavior-x:contain;padding-bottom:4px}
.g2{grid-template-columns:1fr 1fr}
.g-side{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.g-side>.grid{align-content:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ph h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.03em;color:var(--ink)}
.ph .sub{font-size:11.5px;color:var(--muted)}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px}
.kpi{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kpi+.kpi{border-left:1px solid var(--line2)}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:600}
.kpi .d{font-size:11.5px}
.up{color:var(--good)} .down{color:var(--crit)} .flat{color:var(--muted)}
.kpi .def{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpis.small .kpi{padding:9px 16px}
.kpis.rates{grid-template-columns:repeat(6,minmax(0,1fr))}
/* 週別の推移（概要） */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px 14px}
.wgrid.wide{grid-template-columns:1fr}
.wcell{border:1px solid var(--line2);border-radius:10px;padding:8px 10px 2px;min-width:0}
.wcell .wt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.wcell .wt b{font-weight:600;white-space:nowrap}
.wcell .wv{font-size:11px;color:var(--muted);text-align:right}
.wcell .wv .num{color:var(--ink);font-weight:600;font-size:13px}
.wcell .wg{display:inline-block;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-right:6px;font-weight:500;vertical-align:1px}
.band{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.band.g{background:var(--good-bg);color:var(--good)} .band.y{background:var(--warn-bg);color:var(--warn)} .band.r{background:var(--crit-bg);color:var(--crit)}
.tt td.bg-g{background:var(--good-bg)} .tt td.bg-y{background:var(--warn-bg)} .tt td.bg-r{background:var(--crit-bg)}
.kpis.small .v{font-size:16px}
/* 評価 */
.evg-S{--gc:#b8860b}.evg-A{--gc:var(--good)}.evg-B{--gc:var(--accent2)}.evg-C{--gc:var(--warn)}.evg-D{--gc:var(--crit)}.evg-N{--gc:var(--muted)}
.chip.evg{background:var(--gc);border-color:transparent;color:#fff;font-weight:600;cursor:pointer}
.ev{border-left:5px solid var(--gc)}
.ev-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.ev-head{display:flex;gap:12px;align-items:center}
.ev-badge{background:var(--gc);color:#fff;font-size:24px;font-weight:700;border-radius:10px;min-width:56px;padding:2px 14px;text-align:center;line-height:1.45}
.ev-sum{font-size:15px;font-weight:600}
.ev-meta{font-size:11.5px;color:var(--muted)}
.ev-fix{--mc:var(--crit);margin-top:12px;background:color-mix(in srgb,var(--mc) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--mc) 28%,var(--panel));border-left:4px solid var(--mc);border-radius:8px;padding:9px 13px}
.ev-fix b{color:var(--mc);font-size:13px}
.ev-fix p{margin:4px 0 0;font-size:12.5px;line-height:1.65}
.m-so{--mc:#00838f}.m-sur{--mc:#6a1b9a}.m-ad{--mc:var(--warn)}.m-ok{--mc:var(--good)}.m-hold{--mc:var(--muted)}.m-bad{--mc:var(--crit)}
.ev-h3{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:12px}
.ev-acts{margin:4px 0 0;padding-left:20px}
.ev-acts li{font-size:12.5px;line-height:1.6;margin-bottom:4px}
.ev-leg{font-size:11px;color:var(--muted);margin-bottom:6px}
.ev-leg b{font-weight:700}
.ev-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.evc{border:1px solid var(--line);border-radius:8px;padding:6px 6px;text-align:center;display:flex;flex-direction:column;background:var(--panel)}
.evc.na{background:var(--panel2)}
.evc.bn{border:2px solid var(--crit);padding:5px 5px}
.evc-l{font-size:12px;font-weight:600;color:var(--ink2)}
.evc-m{font-size:10px;color:var(--muted);line-height:1.2}
.evc-v{font-size:19px;font-weight:700;line-height:1.3}
.evc-d{font-size:10.5px;color:var(--muted)}
.mk-a{color:var(--good)}.mk-b{color:var(--s1)}.mk-c{color:var(--warn)}.mk-d{color:var(--crit)}.mk-na{color:var(--line)}
.ev-str{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.ev-str span{background:var(--good-bg);color:var(--good);border-radius:7px;padding:5px 10px;font-size:12px;line-height:1.5}
.evc-t{font-size:10.5px;font-weight:600;line-height:1.35;margin-top:2px}
.evc-t small{display:block;font-weight:400;color:var(--muted)}
.tr-up{color:var(--good)} .tr-down{color:var(--crit)} .tr-flat{color:var(--muted)}
.ev-imp{color:var(--good);font-weight:600}
.ev-warn{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.ev-warn span{background:var(--crit-bg);color:var(--crit);border-radius:7px;padding:5px 10px;font-size:12px;line-height:1.5}
.rv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis.yk{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.kpis.yk{grid-template-columns:repeat(3,1fr)}}
.rv-box{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--panel2);min-width:0}
.rv h3{font-size:11.5px;color:var(--muted);font-weight:600;margin:0 0 6px;letter-spacing:.03em}
.rv-t{margin:4px 0;font-size:12.5px;line-height:1.6}
.rv-big{margin:4px 0;font-size:14px}
.rv-s{margin:2px 0;font-size:11.5px;color:var(--muted);line-height:1.55}
.rv-why{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink2)}
.rv-why.good{color:var(--good)} .rv-why.warn{color:var(--warn)}
.rv-wave{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:8px}
.rv-wave span{flex:1;background:var(--s3);opacity:.75;border-radius:2px 2px 0 0}
.rv-wave span.now{background:var(--muted)}
.rv-wl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
.rv-next{margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
.rv-next ol{margin:4px 0 0;padding-left:20px} .rv-next li{font-size:12.5px;line-height:1.65;margin-bottom:3px}
@media (max-width:1100px){.rv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.rv-grid{grid-template-columns:1fr}}
.ev-note{margin-top:12px;font-size:10.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line2);padding-top:8px}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.blockhead h2{font-size:13px;margin:0;font-weight:600}
.blockhead .sub{font-size:11.5px;color:var(--muted)}
.bh-l{display:flex;align-items:center;gap:12px}
.seg.sm button{padding:3px 11px;font-size:12px}
.gapnote{color:var(--warn)}
.tip table{border-collapse:collapse;width:100%;font-size:11.5px}
.tip th,.tip td{padding:2px 0 2px 10px;border:none;text-align:right;white-space:nowrap}
.tip th{color:var(--muted);font-weight:400;font-size:10.5px}
.tip td:first-child,.tip th:first-child{text-align:left;padding-left:0;color:var(--ink2)}
.tt tr.sep td{border-top:2px solid var(--line)}
/* insight list */
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.notes li{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line2)}
.notes li:first-child{border-top:none}
.notes .t{font-size:12.5px}
.notes .t small{display:block;color:var(--muted);font-size:11.5px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;text-align:center;white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--panel2)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:7px}
.share{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.share i{display:block;height:7px;border-radius:2px;background:var(--grid);width:64px;position:relative;overflow:hidden}
.share i b{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.code{font-size:11.5px;color:var(--muted)}
.tt{width:auto}
.tt th,.tt td{padding:6px 9px}
.tt th small{display:block;font-size:10px;color:var(--muted)}
.tt .stk{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;border-right:1px solid var(--line);font-weight:500;color:var(--ink)}
.tt th.stk{color:var(--muted)}
.tt .sun{background:var(--panel2)}
.tt.heat td{min-width:44px}
.tt .pl{white-space:nowrap;line-height:1.35}
.tt .pl small{color:var(--muted);margin-left:2px;font-size:10.5px}
.tt .pl.neg,.tt .neg{color:var(--crit)}
.tt td{vertical-align:top}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.tt tbody tr:hover td{background:var(--accent-soft)}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.stack{display:flex;flex-direction:column;gap:2px}
.row-title{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:6px 2px 0}
.row-title b{font-weight:600;color:var(--ink)}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px;padding:6px 0}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.foot{font-size:11.5px;color:var(--muted)}
/* tooltip */
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:170px;display:none}
.tip h4{margin:0 0 4px;font-size:12px}
.tip .r{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.tip .r span:first-child{color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.18);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .2s ease;z-index:20;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:15px}
.dh .sub{font-size:11.5px;color:var(--muted)}
.dclose{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px}
.db{padding:12px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--ink2)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.dsec h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em}
@media (prefers-reduced-motion: reduce){.drawer,.scrim{transition:none}}
@media (max-width:1100px){.ev-grid{grid-template-columns:1fr}.g-side{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-left:none}.kpis.rates{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.g2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}body{padding-inline:16px}}
</style>

<div class="app">
  <header class="top">
    <div class="mark"><b>商品カルテ</b></div>

    ['お気に入り率', S('pv', A) ? S('fav', A) / S('pv', A) : null, S('pv', B) ? S('fav', B) / S('pv', B) : null, v => pct(v, 1)]];
  const lyOn = S('uu', B) > 0;   // 去年の同じ4週に売っていたか

  const nextLY = sum('units', L + 1, L + 8), ly4 = S('units', B), ty4 = S('units', A);

/* ---------- 週別の推移（概要の下） ---------- */

  { g: '買われた', l: '受注点数', units: true }, { g: '買われた', l: '購入者数', f: (p, b) => bsum(p.buyers, b), c: 'var(--s1)' }, { g: '買われた', l: 'CVR', rate: 'cvr' },
  { g: '買われた', l: 'お気→購入率', rate: 'f2b' }, { g: 'お金', l: '受注額（税抜）', f: (p, b) => bsum(p.amt, b), c: 'var(--s1)', kind: 'yen' },
  { g: 'お金', l: '売れ値（税抜・週の平均）', f: (p, b) => bmean(p.price, b), kind: 'yen', step: true, c: 'var(--ink2)', neutral: true },
  { g: '広告', l: '広告費', f: (p, b) => bsum(p.ad.cost, b), c: 'var(--s2)', kind: 'yen', neutral: true }, { g: '広告', l: '広告経由の売上', f: (p, b) => bsum(p.ad.rev, b), c: 'var(--s1)', kind: 'yen' },
  { g: '広告', l: 'ROAS', rate: 'roas' }, { g: '広告', l: '広告クリック率', rate: 'ctr' }];

WK_M.forEach(m => { if (m.rate) m.r = RATES.find(r => r.k === m.rate); });
const WK_SPANS = [['12', '12週'], ['26', '半年'], ['52', '1年'], ['all', '全期間']];
const wkFull = b => b.e - b.s + 1 === 7;
function wkRange(pr) {
  const e = N - 1, s0 = prStart(pr);
  if (state.wkSpan === 'all') return [s0, e];
  let s = Math.max(s0, e - (+state.wkSpan) * 7 + 1);
  if (s > s0) while (s < e && DAYS[s].getDay() !== 1) s++;   // 最初の週を月曜からそろえる（データ開始の週はそのまま）
  return [s, e];
}
const wkFmt = (m, v) => m.r ? pct(v, m.r.dg) : m.kind === 'yen' ? yen(v) : num(v);
function wkHead(m, vals, bs) {   // 見出し：最後の7日そろった週の値と、その前週との比較
  let i = bs.length - 1; while (i >= 0 && !wkFull(bs[i])) i--;
  if (i < 0 || vals[i] == null) return '';
  const v = vals[i], p = i > 0 ? vals[i - 1] : null; let d = '';
  if (p != null) {
    const x = m.r ? (v - p) * 100 : p ? v / p - 1 : null;
    if (x != null && isFinite(x)) { const cl = m.neutral ? 'flat' : x > 0 ? 'up' : x < 0 ? 'down' : 'flat';
      d = ` 前週比 <span class="${cl}">${x >= 0 ? '+' : ''}${m.r ? x.toFixed(m.r.dg) + 'pt' : Math.round(x * 100) + '%'}</span>`; }
  }

}

function weekGridHTML() {

    ['受注点数', b => num(bsum(pr.units, b)), 'sep'], ['　うち予約', b => b.s > SKU_END ? '—' : num(rsvB(pr, b) || 0)], ['受注額', b => yen(bsum(pr.amt, b))], ['お気に入り', b => num(bsum(pr.fav, b))],
    ['PV', b => num(bsum(pr.pv, b)), null, wk ? b => (b.e - b.s >= 6 ? CRIT.pvw(bsum(pr.pv, b)) : null) : null],   /* 途中の週は色を付けない */

    ['広告の表示回数（imp）', b => num(bsum(pr.ad.imp, b))], ['広告クリック', b => num(bsum(pr.ad.click, b))], ['広告費', b => yen(bsum(pr.ad.cost, b))], ['広告経由の売上', b => yen(bsum(pr.ad.rev, b))], ['ランキングPV', b => num(bsum(pr.rank, b))]];

function skuTrendTable(pr, rows, cols, bs, key, wk) {
  const vals = rows.map(r => bs.map(b => bsum(r.k[key], b) || 0)), mx = Math.max(1, ...vals.flat());
  const base = key === 'units' ? 'var(--s1)' : 'var(--s3)';
  const cell = v => `<td style="background:${v ? `color-mix(in srgb, ${base} ${Math.round(12 + v / mx * 58)}%, var(--panel))` : 'transparent'};${v / mx > .55 ? 'color:#fff;' : ''}">${v ? num(v) : '<span class="flat">·</span>'}</td>`;
  const tot = bs.map((_, i) => vals.reduce((a, r) => a + r[i], 0));
  const sun = b => !wk && b.d.getDay() === 0 ? ' class="sun"' : '';
  return `<table class="tt heat"><thead><tr><th class="stk">${wk ? '週' : '日付'}</th>${bs.map(b => `<th${sun(b)}>${wk ? b.label : md(b.d)}${wk ? '' : `<small>${DOW[b.d.getDay()]}</small>`}</th>`).join('')}<th>合計</th></tr></thead>
    <tbody>${rows.map((r, j) => `<tr><td class="stk"><i class="dot" style="background:${cols[j]}"></i>${skuName(r.k)}</td>${vals[j].map(cell).join('')}<td><b>${num(vals[j].reduce((a, x) => a + x, 0))}</b></td></tr>`).join('')}
    <tr class="sep"><td class="stk"><b>合計</b></td>${tot.map(v => `<td><b>${num(v)}</b></td>`).join('')}<td><b>${num(tot.reduce((a, x) => a + x, 0))}</b></td></tr>
    <tr class="sep"><td class="stk">販売価格（税抜）</td>${bs.map(b => `<td${sun(b)}>${priceCell(pr, b)}</td>`).join('')}<td></td></tr>
    <tr><td class="stk">クーポン利用額</td>${bs.map(b => `<td${sun(b)}>${cpnCell(pr, b)}</td>`).join('')}<td>${cpnCell(pr, { s: bs[0].s, e: bs[bs.length - 1].e })}</td></tr>
    <tr><td class="stk">利益（目安・本店）</td>${bs.map(b => `<td${sun(b)}>${pfCell(pr, b, 'gp')}</td>`).join('')}<td><b>${pfCell(pr, { s: bs[0].s, e: bs[bs.length - 1].e }, 'gp')}</b></td></tr></tbody></table>`;
}
function renderSku(v) {
  const pr = P[state.p], [s, e] = range(), st = skuStats(pr, s, Math.min(e, SKU_END)), rows = st.rows;
  if (!rows.length) { v.innerHTML = '<div class="panel empty">SKUのデータがありません</div>'; return; }
  const top = rows[0], wkTxt = r => `${skuName(r.k)}（${r.weeks.toFixed(1)}週）`;
  const out0 = rows.filter(r => r.stock === 0 && r.u7 + r.up7 > 0);
  const soon = rows.filter(r => r.stock > 0 && r.weeks != null && r.weeks < SKU_SOON);
  const heavy = rows.filter(r => r.stock > 0 && (r.weeks != null ? r.weeks >= SKU_HEAVY : r.stock >= 10));
  const sent = [`売れの中心は${sw(top.k.color)}<b>${skuName(top.k)}</b>（期間の売れの${Math.round(top.su * 100)}%）。`];
  if (out0.length) sent.push(`<b>${out0.map(r => skuName(r.k)).join('・')}</b>は直近2週で売れていたのに在庫がありません。`);
  if (soon.length) sent.push(soon.length === rows.length ? `全色、今の売れペースだと${SKU_SOON}週以内に在庫が切れます（${soon.map(wkTxt).join('・')}）。`
    : `<b>${soon.map(wkTxt).join('・')}</b>は今の売れペースだと${SKU_SOON}週以内に切れます。`);
  if (heavy.length) sent.push(`<b>${heavy.map(r => r.weeks != null ? wkTxt(r) : skuName(r.k) + '（直近2週売れなし・在庫' + num(r.stock) + '）').join('・')}</b>は${SKU_HEAVY}週以上もつ在庫があり、余りぎみです。`);
  if (!out0.length && !soon.length && !heavy.length) sent.push('在庫と売れのバランスに大きな偏りはありません。');
  const bar = (x, col) => `<span class="share"><span class="num">${Math.round(x * 100)}%</span><i><b style="width:${Math.round(x * 100)}%;background:${col}"></b></i></span>`;
  v.innerHTML = `<div class="panel" style="padding-block:12px"><div class="t">${sent.join(' ')}</div><div class="foot" style="margin-top:4px">期間 ${md(DAYS[s])}〜${md(DAYS[Math.min(e, SKU_END)])}・売れ/お気に入りは${md(DAYS[SKU_END])}まで。「あと」は直近2週の売れペースで今の在庫がもつ週数。</div></div>
    <div class="panel"><div class="ph"><h2>SKU別</h2><span class="sub">行をクリックで日別の動き</span></div><div class="tw"><table>
      <thead><tr><th class="l">カラー / サイズ</th><th class="l">SKU番号</th><th>在庫</th><th>期間の売れ</th><th>直近7日</th><th>うち予約（7日）</th><th>お気に入り</th><th>売れの割合</th><th>お気に入りの割合</th><th>在庫の割合</th><th>あと</th><th class="l">売れの推移</th></tr></thead>
      <tbody>${rows.map((r, j) => `<tr class="click" data-k="${pr.skus.indexOf(r.k)}"><td class="l">${sw(r.k.color)}${skuName(r.k)}</td><td class="l code">${r.k.code}</td><td>${num(r.stock)}${r.k.reserved ? `<div class="code">取置 ${num(r.k.reserved)}</div>` : ''}</td>
        <td>${num(r.units)}</td><td>${num(r.u7)} <span class="${r.u7 > r.up7 ? 'up' : r.u7 < r.up7 ? 'down' : 'flat'}">${r.u7 > r.up7 ? '↑' : r.u7 < r.up7 ? '↓' : '→'}</span></td><td>${r.r7 ? `<b>${num(r.r7)}</b>` : '<span class="flat">0</span>'}</td><td>${num(r.fav)}</td>
        <td>${bar(r.su, 'var(--s1)')}</td><td>${bar(r.sf, 'var(--s3)')}</td><td>${bar(r.ss, 'var(--ink2)')}</td>
        <td><span class="pill ${r.status[0]}">${r.weeks != null ? r.weeks.toFixed(1) + '週' : r.status[1]}</span></td><td class="l"><div class="chart spark" id="sp${j}" style="width:150px"></div></td></tr>`).join('')}
      </tbody></table></div><div class="foot" style="margin-top:8px">売れ・予約・お気に入りはZOZO（本店＋Yahoo店。予約は売上集計の販売タイプ「予約」で、売れに含まれる）、在庫は全チャネル（推移表・POP-UP取り置き除外）。上の文は「あと」（直近2週の売れペースで今の在庫がもつ週数）で判定：3週未満＝切れそう、12週以上＝余りぎみ。</div></div>
    <div class="panel"><div class="ph"><h2>SKU別の推移</h2><div class="seg sm" id="skuMode">${[['units', '売れ'], ['fav', 'お気に入り']].map(([k, l]) => `<button aria-pressed="${state.skuMode === k}" data-v="${k}">${l}</button>`).join('')}</div></div>
      <div class="foot" style="margin:-4px 0 6px">${state.gran === 'week' ? '週別（月曜始まり）' : '日別'}・${md(DAYS[s])}〜${md(DAYS[Math.min(e, SKU_END)])}・棒はSKUごとの積み上げ（下ほどよく売れている色）。グラフも表も横スクロールで過去へ。粒度は右上の「日／週」で切り替え</div>
      <div id="skuLeg"></div><div class="tw" id="skuStackWrap"><div class="chart" id="skuStack"></div></div>
      <details id="skuDet" ${state.skuTblOpen ? 'open' : ''} style="margin-top:8px"><summary>表で見る（色が濃いほど多い）</summary><div class="tw" id="skuTbl"></div><div class="foot" style="margin-top:6px">${CPN_NOTE()}<br>${PF_NOTE(pr)}</div></details>
    </div>`;
  tipFn = null;
  const bs = buckets(s, Math.min(e, SKU_END), 'day');
  rows.forEach((r, j) => chart($('#sp' + j), { id: ++CID, buckets: bs, h: 30, bare: true, minW: 140, tip: null, series: [{ type: 'bar', color: 'var(--s1)', values: bs.map(b => bsum(r.k.units, b)) }] }));
  // SKU別の推移
  const wk = state.gran === 'week', key = state.skuMode, tb = buckets(s, Math.min(e, SKU_END), state.gran), cols = skuColors(rows);
  $('#skuLeg').innerHTML = legend(rows.map((r, j) => [cols[j], skuName(r.k)]));
  chart($('#skuStack'), { id: ++CID, buckets: tb, h: 200, scroll: true, minW: tb.length * (wk ? 56 : 20) + 72, aria: 'SKU別の' + (key === 'units' ? '売れ' : 'お気に入り') + 'の推移',
    tip: i => { const b = tb[i], items = rows.map((r, j) => [cols[j], skuName(r.k), bsum(r.k[key], b) || 0]).filter(x => x[2]).sort((a, c) => c[2] - a[2]);
      return `<h4>${wk ? b.label : mdw(b.d)}</h4>` + (items.length ? items.map(([c, n, v]) => `<div class="r"><span><i style="background:${c}"></i>${n}</span><span>${num(v)}</span></div>`).join('') + `<div class="r"><span><b>合計</b></span><span><b>${num(items.reduce((a, x) => a + x[2], 0))}</b></span></div>` : '<div class="foot">なし</div>'); },
    series: rows.map((r, j) => ({ type: 'bar', stack: true, color: cols[j], stroke: isLight(cols[j]) ? 'var(--muted)' : null, values: tb.map(b => bsum(r.k[key], b) || 0) })) });
  $('#skuTbl').innerHTML = skuTrendTable(pr, rows, cols, tb, key, wk);
  requestAnimationFrame(() => { ['#skuTbl', '#skuStackWrap'].forEach(id => { const t = $(id); if (t) t.scrollLeft = t.scrollWidth; }); });
  $('#skuDet').addEventListener('toggle', () => { state.skuTblOpen = $('#skuDet').open; });
  document.querySelectorAll('#skuMode button').forEach(b => b.onclick = () => { state.skuMode = b.dataset.v; renderAll(); });
  document.querySelectorAll('tr[data-k]').forEach(t => t.onclick = () => openSku(+t.dataset.k));
}

/* ---------- 広告 ---------- */
function renderAd(v) {
  const pr = P[state.p], [s, e] = range(), bs = buckets(s, e, state.gran), wk = state.gran === 'week', A = pr.ad;
  const C = sumR(A.cost, s, e), Rv = sumR(A.rev, s, e), I = sumR(A.imp, s, e), K = sumR(A.click, s, e), Cv = sumR(A.cv, s, e), Pm = sumR(pr.prem, s, e);
  if (!C) { v.innerHTML = '<div class="panel empty">この期間は広告が出ていません。期間を「全期間」にすると過去の広告も見られます。</div>'; return; }
  const roll = bs.map((b, i) => { if (wk) { const c = bsum(A.cost, b); return c ? bsum(A.rev, b) / c : null; } const c = sumZ(A.cost, b.s - 6, b.s); return c ? sumZ(A.rev, b.s - 6, b.s) / c : null; });
  const daily = bs.map(b => { const c = bsum(A.cost, b); return c ? bsum(A.rev, b) / c : null; });
  const evs = []; bs.forEach((b, i) => { if (bsum(pr.prem, b)) evs.push({ i, kind: 'prem' }); });
  const tiles = [['広告費', yen(C)], ['広告経由の売上', yen(Rv)], ['ROAS', pct(Rv / C, 0)], ['クリック率', pct(K / I, 2)], ['クリック単価', yen(C / K)], ['経由件数', num(Cv)]];
  v.innerHTML = `<div class="kpis">${tiles.map(([l, x]) => `<div class="kpi"><span class="l">${l}・期間</span><span class="v num">${x}</span></div>`).join('')}</div>
    <div class="foot">期間 ${md(DAYS[s])}〜${md(DAYS[e])}${Pm ? `・プレミア枠に${num(Pm)}回表示` : ''}</div>
    <div class="panel"><div class="ph"><h2>広告費と経由売上</h2><span class="sub">ROASの高い日は2本の差が大きい日です</span></div>${legend([['var(--s2)', '広告費'], ['var(--s1)', '広告経由の売上']])}<div class="chart" id="a1"></div></div>
    <div class="grid g2">
      <div class="panel"><div class="ph"><h2>ROAS</h2><span class="sub">${wk ? '週ごと' : '点＝その日、線＝直近7日'}</span></div>${legend(wk ? [['var(--s1)', '週のROAS']] : [['var(--s1)', '直近7日のROAS'], ['var(--s1)', 'その日のROAS', 'circle']])}<div class="chart" id="a2"></div></div>
      <div class="panel"><div class="ph"><h2>クリック率</h2><span class="sub">■＝プレミア枠に表示</span></div><div class="chart" id="a3"></div></div>
    </div>`;
  const grp = [];
  tipFn = i => { const b = bs[i], c = bsum(A.cost, b), r = bsum(A.rev, b), im = bsum(A.imp, b), k = bsum(A.click, b);
    const row = (l, x) => `<div class="r"><span>${l}</span><span>${x}</span></div>`;
    return `<h4>${wk ? b.label : mdw(b.d)}</h4>` + row('表示回数', num(im)) + row('クリック', num(k)) + row('クリック率', im ? pct(k / im, 2) : '—') + row('広告費', yen(c)) + row('経由件数', num(bsum(A.cv, b))) + row('経由売上', yen(r)) + row('ROAS', c ? pct(r / c, 0) : '—') + (wk ? '' : row('直近7日ROAS', pct(roll[i], 0))) + (bsum(pr.prem, b) ? row('プレミア表示', num(bsum(pr.prem, b))) : ''); };
  const common = { buckets: bs, group: grp, onClick: wk ? null : (i => openDay(bs[i].s)) };
  chart($('#a1'), { ...common, id: ++CID, h: 180, kind: 'yen', series: [{ type: 'bar', color: 'var(--s2)', values: bs.map(b => bsum(A.cost, b)) }, { type: 'line', color: 'var(--s1)', values: bs.map(b => bsum(A.rev, b)) }] });
  chart($('#a2'), { ...common, id: ++CID, h: 160, kind: 'pct', refs: [{ v: 1, label: '100%（広告費と同額）' }],
    series: wk ? [{ type: 'line', color: 'var(--s1)', values: daily }] : [{ type: 'dots', color: 'var(--s1)', values: daily.map(x => x == null ? null : Math.min(x, 8)) }, { type: 'line', color: 'var(--s1)', values: roll }] });
  chart($('#a3'), { ...common, id: ++CID, h: 160, kind: 'pct', events: evs, series: [{ type: 'line', color: 'var(--s7)', values: bs.map(b => { const im = bsum(A.imp, b); return im ? bsum(A.click, b) / im : null; }) }] });
}

/* ---------- 引き出し ---------- */
function openDrawer(title, sub, html, after) {
  $('#dtitle').textContent = title; $('#dsub').innerHTML = sub; $('#dbody').innerHTML = html;
  $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); hideTip();
  if (after) requestAnimationFrame(after); $('#dclose').focus();
}
function closeDrawer() { $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
$('#dclose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrawer(); });
function openDay(i) {
  const pr = P[state.p], A = pr.ad, d = DAYS[i], kv = arr => `<div class="kv">${arr.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('')}</div>`;
  const c = A.cost[i], r = A.rev[i];
  const skus = pr.skus.map(k => ({ k, u: k.units[i] || 0, f: k.fav[i] || 0, r: (k.resv || [])[i] || 0 })).filter(x => x.u || x.f).sort((a, b) => b.u - a.u || b.f - a.f);
  openDrawer(mdw(d), `${state.p}・${pr.name.replace(/【.*?】|《.*?》/g, '').slice(0, 24)}`, `
    <div class="dsec"><h4>率（その日／直近7日／ブランド7日）</h4><table><thead><tr><th class="l"></th><th>その日</th><th>7日</th><th>ブランド</th></tr></thead><tbody>${RATES.map(r => `<tr><td class="l">${r.l}</td><td>${pct(rateR(pr, r, i, i), r.dg)}</td><td>${pct(rateR(pr, r, i - 6, i), r.dg)}</td><td>${pct(rateR(BR(pr), r, i - 6, i), r.dg)}</td></tr>`).join('')}</tbody></table></div>
    <div class="dsec"><h4>お客さんの動き（商品別実績）</h4>${kv([['PV', num(pr.pv[i])], ['UU', num(pr.uu[i])], ['お気に入り', num(pr.fav[i])], ['カート投入', num(pr.cart[i])], ['受注点数', num(pr.units[i])], ['受注額（税抜）', yen(pr.amt[i])], ['購入者', num(pr.buyers[i])], ['CVR', pr.uu[i] ? pct(pr.buyers[i] / pr.uu[i], 2) : '—']])}</div>
    <div class="dsec"><h4>価格・露出</h4>${kv([['売れ値（税抜）', yen(pr.price[i])], ['プロパー', yen(pr.proper)], ['ランキング経由PV', pr.rank[i] != null ? num(pr.rank[i]) : i > RANK_END ? 'データ未取得' : '掲載なし']])}</div>
    <div class="dsec"><h4>広告</h4>${A.imp[i] ? kv([['表示回数', num(A.imp[i])], ['クリック', num(A.click[i])], ['クリック率', pct(A.click[i] / A.imp[i], 2)], ['広告費', yen(c)], ['経由件数', num(A.cv[i])], ['経由売上', yen(r)], ['ROAS', c ? pct(r / c, 0) : '—'], ['プレミア表示', num(pr.prem[i] || 0)]]) : '<div class="foot">広告は出ていません</div>'}</div>
    <div class="dsec"><h4>SKU別（売上集計・お気に入り日次）</h4>${i > SKU_END ? '<div class="foot">この日のSKU別データはまだありません</div>' : skus.length ? `<table><thead><tr><th class="l">カラー</th><th>売れ</th><th>うち予約</th><th>お気に入り</th></tr></thead><tbody>${skus.map(x => `<tr><td class="l">${sw(x.k.color)}${skuName(x.k)}</td><td>${num(x.u)}</td><td>${num(x.r)}</td><td>${num(x.f)}</td></tr>`).join('')}</tbody></table>` : '<div class="foot">この日はSKU別の売れ・お気に入りがありません</div>'}</div>`);
}
function openSku(j) {
  const pr = P[state.p], k = pr.skus[j], [s, e] = range(), ke = Math.min(e, SKU_END), st = skuStats(pr, s, ke).rows.find(r => r.k === k), bs = buckets(s, ke, 'week');
  openDrawer(skuName(k), `${k.code}${k.jan ? '・JAN ' + k.jan : ''}`, `
    <div class="dsec"><div class="kv">${[['在庫（全チャネル）', num(k.stock)], ['POP-UP取り置き', num(k.reserved)], ['期間の売れ', num(st.units)], ['期間のお気に入り', num(st.fav)], ['直近7日の売れ', num(st.u7) + '（前7日 ' + num(st.up7) + '）'], ['うち予約（直近7日）', num(st.r7) + '（前7日 ' + num(st.rp7) + '）'], ['直近7日のお気に入り', num(st.f7) + '（前7日 ' + num(st.fp7) + '）'], ['直近2週の売れペース', '週' + num(st.weekly, 1) + '点'], ['在庫がもつ目安', st.weeks != null ? 'あと約' + st.weeks.toFixed(1) + '週' : '—']].map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('')}</div></div>
    <div class="dsec"><h4>週別の売れ</h4><div class="chart" id="dsU"></div></div>
    <div class="dsec"><h4>週別のお気に入り</h4><div class="chart" id="dsF"></div></div>
    <div class="dsec"><h4>週別</h4><table><thead><tr><th class="l">週</th><th>売れ</th><th>お気に入り</th></tr></thead><tbody>${bs.slice().reverse().map(b => `<tr><td class="l">${b.label}</td><td>${num(bsum(k.units, b))}</td><td>${num(bsum(k.fav, b))}</td></tr>`).join('')}</tbody></table></div>`,
    () => { const prev = tipFn; tipFn = null;
      chart($('#dsU'), { id: ++CID, buckets: bs, h: 120, series: [{ type: 'bar', color: 'var(--s1)', values: bs.map(b => bsum(k.units, b)) }] });
      chart($('#dsF'), { id: ++CID, buckets: bs, h: 120, series: [{ type: 'bar', color: 'var(--s3)', values: bs.map(b => bsum(k.fav, b)) }] });
      tipFn = prev; });
}

/* ---------- 全体 ---------- */
function go(h) { if (!D.names[h] || h === state.p) return; loadP(h, () => { state.p = h; if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h); closeDrawer && closeDrawer(); renderAll(); scrollTo(0, 0); }); }
function step(dir) { if (EMBED) parent.postMessage({ type: 'karte-nav', dir }, '*'); else go(KEYS[(KEYS.indexOf(state.p) + dir + KEYS.length) % KEYS.length]); }
addEventListener('hashchange', () => { const h = hashP(); if (h) go(h); });
addEventListener('message', e => { const m = e.data || {}; if (m.type === 'karte-open') go(m.h); });
function renderAll() {
  renderChrome(); const v = $('#view'); hideTip();
  v.className = 'grid';
  ({ overview: renderOverview, daily: renderDaily, sku: renderSku, ad: renderAd })[state.tab](v);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderAll, 150); });
addEventListener('keydown', ev => { if (ev.target.closest('input,select,textarea') || $('#drawer').classList.contains('on')) return;
  if (ev.key === 'ArrowRight') step(1);
  if (ev.key === 'ArrowLeft') step(-1); });
if (D) loadP(state.p, renderAll);
</script>
