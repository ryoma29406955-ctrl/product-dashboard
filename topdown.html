<title>目標逆算</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* 商品カルテと同じトークン。上から「目標→分解→直す場所→品番」の順に要約から詳細へ */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f7f9fb; --ink:#17212f; --ink2:#45536a; --muted:#768397;
  --line:#dce2ea; --line2:#edf1f5;
  --accent:#1f497d; --accent2:#2e74b5; --accent-soft:#e7eef8;
  --good:#2e7d32; --good-bg:#e5f2e6; --warn:#a85a00; --warn-bg:#fcefd9; --crit:#c62828; --crit-bg:#fbe4e4;
  --main:#4a3aa7; --main-bg:#ece9f9;
  --g1:#c62828; --g2:#a85a00; --g3:#2e74b5; --g4:#2e7d32;
  --sans:"IBM Plex Sans","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151c; --panel:#17202a; --panel2:#1c2530; --ink:#e8edf4; --ink2:#b4c0ce; --muted:#8592a4;
    --line:#2a3542; --line2:#212b37;
    --accent:#9bbde8; --accent2:#5d9be0; --accent-soft:#1d2b3e;
    --good:#72c476; --good-bg:#1b3121; --warn:#f0a648; --warn-bg:#382911; --crit:#ef7474; --crit-bg:#3b1b1c;
    --main:#9085e9; --main-bg:#25213f;
    --g1:#ef7474; --g2:#f0a648; --g3:#5d9be0; --g4:#72c476;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151c; --panel:#17202a; --panel2:#1c2530; --ink:#e8edf4; --ink2:#b4c0ce; --muted:#8592a4;
  --line:#2a3542; --line2:#212b37;
  --accent:#9bbde8; --accent2:#5d9be0; --accent-soft:#1d2b3e;
  --good:#72c476; --good-bg:#1b3121; --warn:#f0a648; --warn-bg:#382911; --crit:#ef7474; --crit-bg:#3b1b1c;
  --main:#9085e9; --main-bg:#25213f;
  --g1:#ef7474; --g2:#f0a648; --g3:#5d9be0; --g4:#72c476;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;padding-inline:24px;padding-block:18px 48px;margin:0}
.app{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px}
.mark b{font-family:"BIZ UDPGothic",var(--sans);font-size:15px;letter-spacing:.06em;color:var(--accent)}
.trial{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.asof{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;padding:9px 18px 10px;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent2);font-weight:600}
.tab small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:13.5px;margin:0;font-weight:600;letter-spacing:.03em}
.ph .sub{font-size:11.5px;color:var(--muted)}
/* 目標 */
.goal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px}
.gk{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gk+.gk{border-left:1px solid var(--line2)}
.gk .l{font-size:11.5px;color:var(--muted)}
.gk .v{font-size:24px;font-weight:600}
.gk .d{font-size:12px;color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent2);border-radius:99px}
/* 分解ツリー */
.tree{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.tf{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--panel)}
.tf.res{background:var(--accent-soft);border-color:transparent}
.tf .l{font-size:11.5px;color:var(--muted)}
.tf .v{font-size:19px;font-weight:600}
.tf .need{font-size:11.5px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.op{align-self:center;font-size:18px;color:var(--muted);flex:0 0 auto}
.callout{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:13px;line-height:1.7}
.callout b{color:var(--accent)}
.tiers{margin-top:12px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;align-items:center;font-size:12px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line2)}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden}
.t-main{background:var(--main)} .t-ok{background:var(--accent2)} .t-low{background:var(--muted)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* グループ */
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gc{border:1px solid var(--line);border-top:4px solid var(--gcol);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--panel);text-align:left;min-width:0}
.gc[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gcol)}
.gc .t{font-weight:600;font-size:13.5px;color:var(--gcol)}
.gc .q{font-size:11.5px;color:var(--muted);line-height:1.5}
.gc .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.gc .big{font-size:20px;font-weight:600;color:var(--ink)}
.gc .bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.gc .bar i{display:block;height:100%;background:var(--gcol)}
.G1{--gcol:var(--g1)} .G2{--gcol:var(--g2)} .G3{--gcol:var(--g3)} .G4{--gcol:var(--g4)}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}
/* 表 */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);color:var(--ink);font:inherit;width:220px;max-width:100%}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line2);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;font-size:11.5px;cursor:pointer;z-index:1}
th[aria-sort]{color:var(--accent)}
td.l,th.l{text-align:left}
td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis}
td.act{white-space:normal;min-width:260px;max-width:380px;text-align:left;color:var(--ink2);line-height:1.5}
tbody tr:hover{background:var(--panel2)}
tbody tr{cursor:pointer}
.gp{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--gcol);background:color-mix(in srgb,var(--gcol) 12%,var(--panel));white-space:nowrap}
.band{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:999px;margin-left:5px}
.band.g{background:var(--good-bg);color:var(--good)} .band.y{background:var(--warn-bg);color:var(--warn)} .band.r{background:var(--crit-bg);color:var(--crit)} .band.m{background:var(--main-bg);color:var(--main)}
.warn{color:var(--crit);font-weight:600}
.crit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.crit div{font-size:12px;color:var(--ink2);line-height:1.7}
.crit b{display:block;font-size:12px;color:var(--ink);margin-bottom:2px}
@media (max-width:1100px){.goal{grid-template-columns:repeat(2,1fr)}.gk:nth-child(3){border-left:none}.groups{grid-template-columns:repeat(2,1fr)}.crit{grid-template-columns:1fr}}
@media (max-width:640px){body{padding-inline:16px}.goal,.groups{grid-template-columns:1fr}.gk+.gk{border-left:none;border-top:1px solid var(--line2)}.op{display:none}.tiers{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="mark"><b>目標逆算</b></div>
    <div class="asof" id="asof"></div>

  <section class="panel" id="groups"></section>
  <section class="panel" id="list"></section>
  <section class="panel" id="crit"></section>
</div>

const bd = b => b ? `<span class="band ${b[0]}">${b[1]}</span>` : '';
const GN = { G1: '① 見られていない', G2: '② 刺さっていない', G3: '③ 買われていない', G4: '④ 良好' };
const GQ = { G1: `PV 週${num(C.PV_MIN)}未満`, G2: `PV${num(C.PV_MIN)}以上・お気に入り率${C.FAV[1] * 100}%未満`, G3: `お気に入り率${C.FAV[1] * 100}%以上・CVR${C.CVR[0] * 100}%未満 → 値段を疑う`, G4: `お気に入り率・CVRとも基準以上` };
const GU = { G1: `PVが週${num(C.PV_MIN)}になったら`, G2: `お気に入り率が${C.FAV[1] * 100}%になったら`, G3: `CVRが${C.CVR[0] * 100}%になったら`, G4: `主力（週${num(C.PV_MAIN)}PV）になったら` };
const state = { b: Object.keys(D.brands)[0], g: 'all', q: '', sort: 'up', dir: -1 };

function analyze(B) {
  const T = B.tot, bU = T.uu / T.pv, bC = T.buy / T.uu, bA = T.amt / T.buy;
  const ps = B.products.map(p => {
    const uupv = p.pv ? p.uu / p.pv : bU, fav = p.pv ? p.fav / p.pv : null, cvr = p.uu ? p.buy / p.uu : null;
    const cvrS = (p.buy + C.K_UU * bC) / (p.uu + C.K_UU);           // 少ない数でぶれないようブランド平均に寄せる
    const aov = p.buy ? p.amt / p.buy : bA, unit = p.units ? p.amt / p.units : null;
    const off = unit && p.proper ? 1 - unit / p.proper : null;
    let g, up = 0;
    if (p.pv < C.PV_MIN) { g = 'G1'; up = (C.PV_MIN - p.pv) * uupv * cvrS * aov; }
    else if (fav < C.FAV[1]) { g = 'G2'; up = p.uu * cvrS * (fav > 0 ? C.FAV[1] / fav - 1 : 1) * aov; }
    else if (cvr < C.CVR[0]) { g = 'G3'; up = p.uu * (C.CVR[0] - cvr) * aov; }
    else { g = 'G4'; up = p.pv < C.PV_MAIN ? (C.PV_MAIN - p.pv) * uupv * cvrS * aov : 0; }
    const sleep = g === 'G1' && p.pv < C.PV_SLEEP, noStock = p.stock == null || p.stock <= 0;
    if (sleep || noStock) up = 0;                                   // 眠っている品番・在庫なしは伸びしろに数えない
    const cap = p.stock > 0 ? p.stock / 4 * (unit || aov) : 0;      // 4週で売り切れる量まで
    const short = up > cap; if (short) up = cap;
    let act;
    if (g === 'G1' && sleep) act = `週${C.PV_SLEEP}PV未満：季節外・終売なら対象外。売りたい品番なら露出づくりから`;
    else if (g === 'G1') act = p.adcost > 0 ? '広告を出しているのにPVが少ない：サムネ・入札・商品名を見直す' : '露出づくり：広告・TS・ランキング枠・サムネ・商品名';
    else if (g === 'G2') act = '見られているのに刺さっていない：1枚目の画像・色展開・商品そのものを見直す';
    else if (g === 'G3') act = off != null && off >= C.PRICE_CUT ? `すでに${Math.round(off * 100)}%引きでも買われない：値段よりサイズ・在庫・2枚目以降の画像を疑う`
      : `値段を疑う（いま${off != null ? Math.round(off * 100) + '%引き' : '割引不明'}）：クーポン・値下げで反応を見る`;
    else act = p.pv < C.PV_MAIN ? 'よく買われる型：露出を足して主力に（広告増額・TS・ランキング）' : '主力：在庫を切らさない・露出を維持';
    if (p.cover != null && p.cover < 28) act += `／在庫カバー${num(p.cover)}日：先に補充`;
    else if (noStock) act += '／在庫なし';
    else if (short) act += '／伸ばすと4週で在庫が尽きる量（伸びしろは在庫まで）';
    return { ...p, uupv, fav, cvr, aov, unit, off, g, up, act, short, sleep };
  });
  return { T, bU, bC, bA, bF: T.fav / T.pv, ps };
}

function renderTabs() {
  $('#tabs').innerHTML = Object.keys(D.brands).map(k => { const B = D.brands[k], wt = B.target ? B.target * 7 / B.dim : null;
    return `<button class="tab" role="tab" aria-selected="${k === state.b}" data-b="${esc(k)}">${esc(k)}<small>${wt ? '直近7日 ' + pct(B.tot.amt / wt, 0) + '（週目標比）' : '目標なし'}</small></button>`; }).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.b = b.dataset.b; state.g = 'all'; render(); });
}

function render() {
  renderTabs();
  const B = D.brands[state.b], A = analyze(B), T = A.T, mo = +D.month.slice(5);
  $('#asof').textContent = `商品別実績 ${md(D.asof)}まで（直近7日＝${md(D.w[0])}〜${md(D.w[1])}）・広告 ${md(D.ad_end)}まで・在庫 ${D.stock_src}時点`;
  const wt = B.target ? B.target * 7 / B.dim : null, gap = wt ? wt - T.amt : null;
  const land = B.mtd_days ? B.mtd / B.mtd_days * B.dim : null;
  $('#goal').innerHTML = `<div class="goal">
    <div class="gk"><span class="l">${mo}月の目標（ZOZO・税抜）</span><span class="v num">${man(B.target)}</span><span class="d num">1週間あたり ${man(wt)}</span></div>
    <div class="gk"><span class="l">直近7日の受注額</span><span class="v num">${man(T.amt)}</span><span class="d num">週目標の ${pct(wt ? T.amt / wt : null, 0)}・前7日 ${man(B.ptot.amt)}</span><div class="meter"><i style="width:${Math.min(100, wt ? T.amt / wt * 100 : 0)}%"></i></div></div>
    <div class="gk"><span class="l">週あたり足りない額</span><span class="v num">${gap > 0 ? man(gap) : '達成ペース'}</span><span class="d">${gap > 0 ? '今のペースとの差' : '週目標を超えています'}</span></div>
    <div class="gk"><span class="l">${mo}月の累計・着地見込み</span><span class="v num">${B.mtd_days ? man(B.mtd) : '—'}</span><span class="d num">${B.mtd_days ? `${B.mtd_days}日分・見込み ${man(land)}（目標比 ${pct(land / B.target, 0)}）` : `${mo}月のデータはまだ入っていません`}</span></div></div>`;

  // 分解：受注額 = PV × UU/PV × CVR × 客単価
  const need = { pv: wt / (A.bU * A.bC * A.bA), cvr: wt / (T.uu * A.bA), aov: wt / T.buy };
  const pvAt15 = wt / (A.bU * C.CVR[0] * A.bA);
  const tf = (l, v, sub, nd) => `<div class="tf"><span class="l">${l}</span><span class="v num">${v}</span><span class="d note">${sub}</span>${nd ? `<span class="need">${nd}</span>` : ''}</div>`;
  const tierOf = p => p.pv >= C.PV_MAIN ? 'main' : p.pv >= C.PV_MIN ? 'ok' : 'low';
  const tiers = { main: { n: 0, pv: 0, amt: 0 }, ok: { n: 0, pv: 0, amt: 0 }, low: { n: 0, pv: 0, amt: 0 } };
  A.ps.forEach(p => { const t = tiers[tierOf(p)]; t.n++; t.pv += p.pv; t.amt += p.amt; });
  const seg = (k, v, tot, lab) => v > 0 ? `<span class="t-${k}" style="width:${v / tot * 100}%" title="${lab}">${v / tot >= .08 ? lab : ''}</span>` : '';
  const extraPV = pvAt15 - T.pv;
  $('#tree').innerHTML = `<div class="ph"><h2>売上の分解（直近7日）</h2><span class="sub">下の段＝ほかを今のままにして、それ1つだけで週目標に届かせるのに必要な値</span></div>
    <div class="tree">
      ${tf('PV', num(T.pv), `前7日 ${num(B.ptot.pv)}`, wt ? `必要 ${num(need.pv)}（×${(need.pv / T.pv).toFixed(2)}）` : '')}<span class="op">×</span>
      ${tf('UU ÷ PV', A.bU.toFixed(2), '1回の訪問で見られるPVの逆数', '')}<span class="op">×</span>
      ${tf('CVR（購入者÷UU）' + bd(cvrB(A.bC)), pct(A.bC, 2), `基準 ${pct(C.CVR[0], 1)}`, wt ? `必要 ${pct(need.cvr, 2)}` : '')}<span class="op">×</span>
      ${tf('客単価', yen(A.bA), '受注額 ÷ 購入者', wt ? `必要 ${yen(need.aov)}` : '')}<span class="op">=</span>
      <div class="tf res"><span class="l">受注額（直近7日）</span><span class="v num">${man(T.amt)}</span><span class="d note">週目標 ${man(wt)}</span><span class="need">お気に入り率 ${pct(A.bF)}${bd(favB(A.bF))}</span></div>
    </div>
    ${wt && gap > 0 ? `<div class="callout">${A.bC < C.CVR[0] ? `CVRを基準の<b>${pct(C.CVR[0], 1)}</b>まで上げても受注額は<b>${man(T.uu * C.CVR[0] * A.bA)}</b>/週（週目標の${pct(T.uu * C.CVR[0] * A.bA / wt, 0)}）。` : `CVRはすでに基準以上（${pct(A.bC, 2)}）。`}
      CVR${pct(Math.max(A.bC, C.CVR[0]), 1)}・客単価そのままで週目標に届くには <b>PV 週${num(Math.max(pvAt15, need.pv * A.bC / Math.max(A.bC, C.CVR[0])))}</b>（今の${(Math.max(pvAt15, T.pv) / T.pv).toFixed(1)}倍）が必要。
      ${extraPV > 0 ? `今より<b>週+${num(extraPV)}PV</b>＝主力（週${num(C.PV_MAIN)}PV）約<b>${Math.ceil(extraPV / C.PV_MAIN)}品番ぶん</b>の露出を新しく作る計算です。` : ''}</div>` : ''}
    <div class="tiers">
      <span class="note">PVの内訳</span><div class="stack">${seg('main', tiers.main.pv, T.pv, `主力 ${tiers.main.n}品番`)}${seg('ok', tiers.ok.pv, T.pv, `1000〜${num(C.PV_MAIN)} ${tiers.ok.n}品番`)}${seg('low', tiers.low.pv, T.pv, `1000未満 ${tiers.low.n}品番`)}</div>
      <span class="note">受注額の内訳</span><div class="stack">${seg('main', tiers.main.amt, T.amt, pct(tiers.main.amt / T.amt, 0))}${seg('ok', tiers.ok.amt, T.amt, pct(tiers.ok.amt / T.amt, 0))}${seg('low', tiers.low.amt, T.amt, pct(tiers.low.amt / T.amt, 0))}</div>
      <span></span><div class="leg"><span><i class="t-main"></i>主力（週${num(C.PV_MAIN)}PV以上）${tiers.main.n}品番</span><span><i class="t-ok"></i>週${num(C.PV_MIN)}〜${num(C.PV_MAIN)} ${tiers.ok.n}品番</span><span><i class="t-low"></i>週${num(C.PV_MIN)}未満 ${tiers.low.n}品番</span></div>
    </div>`;

  // どこを直すと何円戻るか
  const G = {}; ['G1', 'G2', 'G3', 'G4'].forEach(k => G[k] = { n: 0, amt: 0, up: 0, sleep: 0 });
  A.ps.forEach(p => { G[p.g].n++; G[p.g].amt += p.amt; G[p.g].up += p.up; if (p.sleep) G[p.g].sleep++; });
  const maxUp = Math.max(...Object.values(G).map(x => x.up), gap || 0, 1);
  $('#groups').innerHTML = `<div class="ph"><h2>どこを直すと何円戻るか</h2><span class="sub">品番を4つに分け、それぞれ基準まで直ったときの受注額の増え方（週・目安）。カードを押すと下の一覧が絞り込まれます</span></div>
    <div class="groups">${['G1', 'G2', 'G3', 'G4'].map(k => `<button class="gc ${k}" data-g="${k}" aria-pressed="${state.g === k}">
      <span class="t">${GN[k]}</span><span class="q">${GQ[k]}</span>
      <span class="row"><span>${G[k].n}品番</span><span class="num">今 ${man(G[k].amt)}/週</span></span>
      <span class="l note">${GU[k]}</span><span class="big num">+${man(G[k].up)}<small class="note">/週</small></span>
      <span class="bar"><i style="width:${G[k].up / maxUp * 100}%"></i></span>
      <span class="note">${gap > 0 ? `足りない額の ${pct(G[k].up / gap, 0)}` : ''}${G[k].sleep ? `<br>うち週${C.PV_SLEEP}PV未満の${G[k].sleep}品番は数えていません（季節外・終売など）` : ''}</span></button>`).join('')}</div>
    <p class="note" style="margin:10px 0 0">目安の出し方：品番ごとに、いまのUU÷PV・CVR（購入が少ない品番はブランド平均に寄せた値）・客単価のまま、その段の数字だけが基準まで動いたとして計算。在庫のない品番は0、増える分は4週で売り切れる在庫までで頭打ち。4つの合計はそのまま足し算できるものではありません（露出を増やすとCVRは下がりがち、など）。</p>`;
  document.querySelectorAll('.gc').forEach(b => b.onclick = () => { state.g = state.g === b.dataset.g ? 'all' : b.dataset.g; render(); });

  // 品番一覧
  const COLS = [['g', '区分', 'l'], ['h', '品番', 'l'], ['n', '品名', 'l'], ['up', '伸びしろ/週'], ['amt', '受注額/週'], ['pv', 'PV/週'], ['pvw', '前週比'], ['fav', 'お気に入り率'], ['cvr', 'CVR'],
    ['aov', '客単価'], ['off', '売れ値（税込・割引）'], ['stock', '在庫（カバー）'], ['adcost', '広告費/週'], ['act', '次の一手', 'l'], ['c', 'カテゴリ', 'l']];
  const key = (p, k) => k === 'pvw' ? (p.ppv ? p.pv / p.ppv : -1) : k === 'off' ? (p.off ?? -1) : p[k] ?? -1;
  let rows = A.ps.filter(p => (state.g === 'all' || p.g === state.g) && (!state.q || (p.h + p.n + p.c).includes(state.q)));
  rows.sort((a, b) => { const x = key(a, state.sort), y = key(b, state.sort); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.dir; });
  $('#list').innerHTML = `<div class="ph"><h2>品番一覧（${state.g === 'all' ? 'すべて' : GN[state.g]}・${rows.length}品番）</h2>
      <div class="tools"><input id="q" type="search" placeholder="品番・品名・カテゴリで絞り込み" value="${esc(state.q)}" aria-label="絞り込み">${state.g !== 'all' ? '<button class="tab" id="clr" style="padding:4px 10px;font-size:12px">絞り込みを外す</button>' : ''}</div></div>
    <div class="tw"><table><thead><tr>${COLS.map(([k, l, a]) => `<th class="${a || ''}" data-k="${k}" ${state.sort === k ? `aria-sort="${state.dir < 0 ? 'descending' : 'ascending'}"` : ''}>${l}${state.sort === k ? (state.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(p => `<tr data-h="${p.h}" title="押すと商品カルテを開きます">
      <td class="l"><span class="gp ${p.g}">${GN[p.g].slice(0, 1)} ${GN[p.g].slice(2)}</span></td><td class="l num">${p.h}</td><td class="l nm" title="${esc(p.n)}">${esc(p.n)}</td>
      <td class="num"><b>${p.up >= 1 ? '+' + yen(p.up) : '—'}</b></td><td class="num">${yen(p.amt)}</td>
      <td class="num">${num(p.pv)}${bd(pvB(p.pv))}</td><td class="num">${p.ppv ? (p.pv / p.ppv >= 1 ? '+' : '') + Math.round((p.pv / p.ppv - 1) * 100) + '%' : '—'}</td>
      <td class="num">${pct(p.fav)}${bd(p.pv >= 300 ? favB(p.fav) : null)}</td><td class="num">${pct(p.cvr, 2)}${bd(p.uu >= 300 ? cvrB(p.cvr) : null)}</td>
      <td class="num">${yen(p.aov)}</td><td class="num">${yen(p.unit != null ? p.unit * 1.1 : null)}${p.off != null && p.off > .02 ? `（${Math.round(p.off * 100)}%引）` : ''}</td>
      <td class="num ${p.cover != null && p.cover < 28 ? 'warn' : ''}">${p.stock != null ? num(p.stock) : '—'}${p.cover != null ? `（${num(p.cover)}日）` : ''}</td>
      <td class="num">${p.adcost ? yen(p.adcost) : '—'}</td><td class="act">${p.act}</td><td class="l">${esc(p.c)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note" style="margin:8px 0 0">PVが300未満の品番はお気に入り率の、UUが300未満の品番はCVRの色を付けていません（数が少なく、ぶれるため）。在庫は全チャネル・POP-UP取り置きを除いた数、カバー日数は推移表ベース。行を押すと商品カルテを開きます。</p>`;
  const q = $('#q'); q.oninput = () => { state.q = q.value; const pos = q.selectionStart; render(); const q2 = $('#q'); q2.focus(); q2.setSelectionRange(pos, pos); };
  if ($('#clr')) $('#clr').onclick = () => { state.g = 'all'; render(); };
  document.querySelectorAll('#list tbody tr').forEach(tr => tr.onclick = () => openKarte(tr.dataset.h));
  document.querySelectorAll('#list th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = ['g', 'h', 'n', 'c', 'act'].includes(k) ? 1 : -1; } render(); });

  $('#crit').innerHTML = `<div class="ph"><h2>基準</h2><span class="sub">2026/10/04 決定。変える場合は伝えてください</span></div>
    <div class="crit">
      <div><b>PV（週）</b>${num(C.PV_MAIN)}以上＝主力${bd(['m', '主力'])}<br>${num(C.PV_MIN)}以上＝売り場に立っている${bd(['g', '1000以上'])}<br>${num(C.PV_MIN)}未満＝見られていない${bd(['r', '1000未満'])}</div>
      <div><b>お気に入り率（お気に入り÷PV）</b>${C.FAV[0] * 100}%以上${bd(['g', '良い'])}　${C.FAV[1] * 100}〜${C.FAV[0] * 100}%${bd(['y', '標準'])}<br>${C.FAV[2] * 100}〜${C.FAV[1] * 100}%${bd(['r', 'やや弱い'])}　${C.FAV[2] * 100}%未満${bd(['r', '弱い'])}</div>
      <div><b>CVR（購入者÷UU）</b>${C.CVR[0] * 100}%以上${bd(['g', '良い'])}　${C.CVR[1] * 100}〜${C.CVR[0] * 100}%${bd(['y', '基準未満'])}　${C.CVR[1] * 100}%未満${bd(['r', '低い'])}<br>値段の判定：お気に入り率が${C.FAV[1] * 100}%以上なのにCVRが${C.CVR[0] * 100}%未満なら「値段を疑う」。すでに${C.PRICE_CUT * 100}%以上引いていたら、値段よりサイズ・在庫・画像を疑う</div>
    </div>`;
}
render();
</script>
